name: Deploy stage2 demo

on:
  push:
    branches: [main]

concurrency:
  group: deploy-stage2
  cancel-in-progress: false

jobs:
  test:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run test

  build:
    name: Build (vite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      # VITE_ADMIN_API_KEY is baked into the compiled JS at build time (Vite
      # inlines VITE_-prefixed vars) — it must match ADAPTER_ADMIN_API_KEY on
      # the adapter side, NOT ADAPTER_QUERY_API_KEY (a separate, unrelated
      # setting — see jpg-adapter's docker-compose.stage2.yml comment).
      #
      # NOTE: this value ends up readable in plain text in the shipped JS
      # bundle, served publicly by Caddy — that's a pre-existing exposure,
      # not something this workflow introduces. Worth a real fix later (a
      # short-lived, server-minted token instead of a static baked secret).
      - name: Build
        env:
          VITE_ADMIN_API_KEY: ${{ secrets.STAGE2_ADAPTER_ADMIN_API_KEY }}
        run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to stage2 demo (manual approval)
    needs: build
    runs-on: ubuntu-latest
    environment: hetzner-demo
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: rsync to the box (key is forced to rrsync into jpg-frontend-dist only)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGE2_JPG_FRONTEND_DEPLOY_KEY }}
          SSH_HOST: ${{ secrets.STAGE2_SSH_HOST }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          # Destination MUST be ":./" (the restricted root itself), not
          # ":dist/" — the forced command chdirs into the target directory
          # server-side, so any deeper path nests one level too far. Verified
          # empirically against this box's rrsync + a real GNU rsync client
          # (macOS's own /usr/bin/rsync is openrsync, protocol-incompatible
          # with rrsync — this step only works with GNU rsync, which
          # ubuntu-latest ships).
          rsync -avz --delete -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ deploy@"$SSH_HOST":./
